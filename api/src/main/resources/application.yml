spring:
  application:
    name: mopl-api

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-please-change-this-in-real-env-1234567890}
  access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION:1800}
  refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION:1209600}